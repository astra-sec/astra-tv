name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Ordinary APK builds use the tracked FFmpeg JNI libraries.
          submodules: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;34.0.0'

      - name: Restore release signing key
        id: signing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ASTRA_KEYSTORE_BASE64: ${{ secrets.ASTRA_SIGNING_KEYSTORE_BASE64 }}
          ASTRA_STORE_PASSWORD: ${{ secrets.ASTRA_SIGNING_STORE_PASSWORD }}
          ASTRA_KEY_ALIAS: ${{ secrets.ASTRA_SIGNING_KEY_ALIAS }}
          ASTRA_KEY_PASSWORD: ${{ secrets.ASTRA_SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -z "$ASTRA_KEYSTORE_BASE64" || -z "$ASTRA_STORE_PASSWORD" || -z "$ASTRA_KEY_ALIAS" || -z "$ASTRA_KEY_PASSWORD" ]]; then
            echo 'All four ASTRA_SIGNING secrets are required for main release builds.' >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/astra-tv-signing.keystore"
          umask 077
          printf '%s' "$ASTRA_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          echo "store-file=$key_path" >> "$GITHUB_OUTPUT"
          echo 'mode=signed' >> "$GITHUB_OUTPUT"

      - name: Build unsigned APK and run checks
        if: steps.signing.outputs.mode != 'signed'
        run: |
          ./gradlew :app:assembleRelease :app:testDebugUnitTest :app:lintRelease \
            -PastraUnsigned=true --no-daemon --no-configuration-cache --console=plain

      - name: Build signed APK and run checks
        if: steps.signing.outputs.mode == 'signed'
        env:
          ASTRA_SIGNING_STORE_FILE: ${{ steps.signing.outputs.store-file }}
          ASTRA_SIGNING_STORE_PASSWORD: ${{ secrets.ASTRA_SIGNING_STORE_PASSWORD }}
          ASTRA_SIGNING_KEY_ALIAS: ${{ secrets.ASTRA_SIGNING_KEY_ALIAS }}
          ASTRA_SIGNING_KEY_PASSWORD: ${{ secrets.ASTRA_SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:testDebugUnitTest :app:lintRelease \
            --no-daemon --no-configuration-cache --console=plain

      - name: Prepare APK artifact
        id: apk
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import shutil
          import subprocess

          apk_dir = pathlib.Path('app/build/outputs/apk/release')
          metadata = json.loads((apk_dir / 'output-metadata.json').read_text())
          element, = metadata['elements']
          source = apk_dir / element['outputFile']
          unsigned = os.environ['SIGNING_MODE'] != 'signed'
          certificate_sha256 = None
          if not unsigned:
              apksigner = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/34.0.0/apksigner'
              verification = subprocess.run(
                  [str(apksigner), 'verify', '--verbose', '--print-certs', str(source)],
                  capture_output=True, text=True,
              )
              if verification.returncode:
                  raise SystemExit('APK signature verification failed.')
              certificates = re.findall(
                  r'Signer #\d+ certificate SHA-256 digest: ([0-9a-f]+)', verification.stdout,
              )
              expected = json.loads(pathlib.Path('docs/signing/astra-sec-release.json').read_text())
              if certificates != [expected['certificateSha256']]:
                  raise SystemExit('APK was not signed with the expected Astra Sec certificate.')
              certificate_sha256, = certificates
          suffix = '-unsigned' if unsigned else ''
          revision = os.environ['GITHUB_SHA'][:7]
          name = f"astra-tv-{element['versionName']}-{revision}{suffix}"
          output = pathlib.Path('ci-artifacts')
          output.mkdir()
          target = output / (name + '.apk')
          shutil.copyfile(source, target)
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          (output / (target.name + '.sha256')).write_text(f'{digest}  {target.name}\n')
          (output / 'build-info.json').write_text(json.dumps({
              'versionName': element['versionName'],
              'versionCode': element['versionCode'],
              'commit': os.environ['GITHUB_SHA'],
              'signed': not unsigned,
              'certificateSha256': certificate_sha256,
              'sha256': digest,
          }, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'name={name}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(f'### {name}\n\n')
              stream.write('Build, unit tests and release Lint passed.\n\n')
              stream.write('Signing: **unsigned; sign before installing**.\n' if unsigned
                           else 'Signing: **configured release key**.\n')
              if certificate_sha256:
                  stream.write(f'\nVerified certificate SHA256: `{certificate_sha256}`\n')
          PY

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ci-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload test and Lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-release.*
          if-no-files-found: warn
          retention-days: 14

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/astra-tv-signing.keystore"
